name: Validar e publicar painel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guardiao do acervo
        run: python painel_local/guardiao_acervo.py --raiz .
      - name: Testes de regressao
        run: |
          python -m unittest tests.test_integridade_publicacao tests.test_fichamentos tests.test_estadoarte tests.test_interface_painel tests.test_regressoes tests.test_guardiao_acervo tests.test_sincronizar_acervo

  publicar:
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar somente depois da validacao
        id: deployment
        uses: actions/deploy-pages@v4
