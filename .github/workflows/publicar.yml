name: Validar e publicar painel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dependencias dos validadores
        run: python -m pip install Flask PyMuPDF
      - name: Guardiao do acervo
        run: python painel_local/guardiao_acervo.py --raiz .
      - name: Testes de regressao
        run: python -m unittest discover -s tests -p "test_*.py"

  publicar:
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Publicar somente depois da validacao
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Conferir o site publicado pela rede
        run: >-
          python painel_local/verificar_site_publicado.py
          --url "${{ steps.deployment.outputs.page_url }}"
          --tentativas 12
          --intervalo 5
