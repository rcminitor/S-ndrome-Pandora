name: Validar acervo

on:
  pull_request:
    branches: [main]

jobs:
  integridade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias dos validadores
        run: python -m pip install Flask PyMuPDF
      - name: Guardiao do acervo
        run: python painel_local/guardiao_acervo.py --raiz .
      - name: Testes de regressao
        run: python -m unittest discover -s tests -p "test_*.py"
